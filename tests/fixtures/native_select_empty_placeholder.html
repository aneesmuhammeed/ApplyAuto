<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Native Select with Empty Placeholder</title>
</head>
<body>
  <form id="job-form">
    <div>
      <label for="relocation-select">Relocation Preference</label>
      <select id="relocation-select" name="relocationPreference" required>
        <option value="">-- select an option --</option>
        <option value="yes">Yes, open to relocation</option>
        <option value="no">No, remote only</option>
      </select>
    </div>
  </form>
</body>
</html>
